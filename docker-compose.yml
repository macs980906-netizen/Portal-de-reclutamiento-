# Base de datos para probar el portal en tu computadora (sólo desarrollo).
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ridermex
      POSTGRES_PASSWORD: ridermex
      POSTGRES_DB: ridermex_reclutamiento
    ports:
      - "5432:5432"
    volumes:
      - ridermex-db:/var/lib/postgresql/data
volumes:
  ridermex-db:
